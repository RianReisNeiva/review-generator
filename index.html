<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Provas Padrão ENEM</title>

<style>
:root {
  --bg-color: #121212;
  --surface-color: #1e1e1e;
  --primary-color: #bb86fc;
  --primary-hover: #9965f4;
  --text-main: #ffffff;
  --text-muted: #aaaaaa;
  --border-color: #333333;
}

body {
  font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg-color);
  color: var(--text-main);
  padding: 20px;
  margin: 0;
}

.editor-container {
  max-width: 800px;
  margin: 0 auto;
}

h2, h3 { color: var(--primary-color); }

.card {
  background: var(--surface-color);
  padding: 20px;
  border-radius: 8px;
  margin-bottom: 20px;
  border: 1px solid var(--border-color);
  box-shadow: 0 4px 6px rgba(0,0,0,0.3);
}

.input-group {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  margin-bottom: 15px;
}

.input-full { grid-column: span 2; }

label {
  display: block;
  font-size: 14px;
  margin-bottom: 5px;
  color: var(--text-muted);
}

input[type="text"], input[type="number"], textarea, select {
  width: 100%;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid var(--border-color);
  background: var(--bg-color);
  color: var(--text-main);
  box-sizing: border-box;
  font-family: inherit;
}

textarea { resize: vertical; min-height: 80px; }

input:focus, textarea:focus, select:focus {
  outline: none;
  border-color: var(--primary-color);
}

button {
  background: var(--primary-color);
  color: #000;
  font-weight: bold;
  padding: 12px 20px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.2s;
  width: 100%;
  font-size: 16px;
  margin-bottom: 10px;
}

button:hover { background: var(--primary-hover); }

button:disabled {
  background: #444 !important;
  color: #888 !important;
  cursor: not-allowed !important;
  opacity: 0.7;
}

.action-buttons {
  display: flex;
  gap: 10px;
}

.q-box {
  background: #252525;
  padding: 15px;
  border-radius: 6px;
  margin-bottom: 15px;
  border-left: 4px solid var(--primary-color);
}

.alt-grid {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 10px;
  align-items: center;
  margin-top: 10px;
}

.alt-label { font-weight: bold; color: var(--primary-color); }

.checkbox-group {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}
.checkbox-group input { width: auto; transform: scale(1.2); }
.checkbox-group label { margin: 0; color: var(--text-main); font-size: 15px; }

@media print {
  @page {
    size: A4;
    margin: 15mm;
  }

  body {
    background: white;
    color: black;
    padding: 0;
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
  }

  .editor-container { display: none; }

  .page {
    page-break-after: always;
    width: 100%;
  }

  .header-prova {
    border: 2px solid black;
    padding: 15px;
    margin-bottom: 20px;
  }
  
  .header-prova h1 { margin: 0 0 10px 0; font-size: 18px; text-align: center; text-transform: uppercase; }
  .info-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; }
  .linha-preenchimento { border-bottom: 1px solid black; flex-grow: 1; margin: 0 10px; }

  .prova-content { font-size: 11pt; line-height: 1.5; text-align: justify; }
  .questao-item { margin-bottom: 25px; page-break-inside: avoid; }
  .enunciado { font-weight: bold; margin-bottom: 10px; }
  .img-questao { max-width: 80%; max-height: 250px; display: block; margin: 10px auto; }
  .alternativa-print { margin-bottom: 5px; margin-left: 15px; display: flex; }
  .letra-alt { font-weight: bold; margin-right: 8px; }
  
  .linha-discursiva { border-bottom: 1px solid black; margin-top: 25px; width: 100%; }

  .cartao-titulo {
    text-align: center;
    border-bottom: 2px solid black;
    padding-bottom: 10px;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  
  .instrucoes-cartao {
    border: 1px solid black;
    padding: 10px;
    font-size: 11pt;
    margin-bottom: 20px;
    background: #f9f9f9 !important;
    -webkit-print-color-adjust: exact;
  }

  .cartao-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
  }

  .q-linha-cartao {
    display: flex;
    align-items: center;
    margin-bottom: 8px;
    border-bottom: 1px dashed #ccc;
    padding-bottom: 4px;
  }

  .q-num-cartao {
    width: 25px;
    font-weight: bold;
    font-size: 12pt;
  }

  .bolhas-container {
    display: flex;
    gap: 8px;
  }

  .bolha-print {
    width: 18px;
    height: 18px;
    border: 1.5px solid black;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9pt;
    font-weight: bold;
    color: black;
  }

  .gabarito-lista { font-size: 14pt; line-height: 2; column-count: 2; }
}
</style>
</head>

<body>

<div class="editor-container">
  <h2>📋 Gerador de Provas</h2>
  <p> © Direitos reservados a Rian Reis Neiva</p>

  <div class="card">
    <h3>Dados do Cabeçalho</h3>
    <div class="input-group">
      <div class="input-full">
        <label>Nome da Instituição de Ensino</label>
        <input id="escola" type="text" placeholder="Ex: Colégio Estadual Central">
      </div>
      <div>
        <label>Série / Turma</label>
        <input id="serie" type="text" placeholder="Ex: 3º Ano do Ensino Médio">
      </div>
      <div>
        <label>Disciplina</label>
        <input id="disciplina" type="text" placeholder="Ex: Matemática e suas Tecnologias">
      </div>
      <div>
        <label>Professor(a)</label>
        <input id="professor" type="text" placeholder="Nome do docente">
      </div>
      <div>
        <label>Data de Aplicação</label>
        <input id="data" type="text" placeholder="DD/MM/AAAA">
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Configurações Adicionais</h3>
    <div class="input-group">
      <div>
        <label>Quantidade de Questões</label>
        <input type="number" id="qtdQuestoes" value="5" min="1" max="90">
      </div>
      <div style="display: flex; align-items: flex-end;">
        <button onclick="criarCampos()">Gerar Campos de Questão</button>
      </div>
    </div>
    
    <div class="checkbox-group">
      <input type="checkbox" id="gerarGabaritoProf" checked>
      <label for="gerarGabaritoProf">Incluir página de Gabarito do Professor na impressão</label>
    </div>
  </div>

  <div id="editor"></div>

  <div class="action-buttons">
    <button style="background: #03dac6; color: black;" onclick="gerarProva()">✔ Processar Prova</button>
    <button id="btnImprimir" disabled onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
  </div>
</div>

<div id="saida"></div>

<script>
let imagens = {};
const alternativasLetras = ['A', 'B', 'C', 'D', 'E'];

function criarCampos() {
  const q = document.getElementById("qtdQuestoes").value;
  const editor = document.getElementById("editor");
  editor.innerHTML = "";

  document.getElementById("btnImprimir").disabled = true;

  for (let i = 1; i <= q; i++) {
    let altsHtml = '';
    
    for(let j = 0; j < 5; j++) {
      altsHtml += `
        <div class="alt-label">${alternativasLetras[j]})</div>
        <input type="text" id="q${i}_alt${j}" placeholder="Texto da alternativa ${alternativasLetras[j]} (deixe em branco para ocultar)">
      `;
    }

    editor.innerHTML += `
      <div class="q-box">
        <label style="color: var(--primary-color); font-weight:bold; font-size: 16px;">Questão ${i}</label>
        <textarea id="q${i}_texto" placeholder="Digite o enunciado da questão..." style="margin-top: 10px;"></textarea>
        
        <label style="margin-top: 10px;">Imagem da Questão (Opcional):</label>
        <input type="file" accept="image/*" onchange="carregarImagem(event, ${i})" style="margin-bottom: 15px;">
        
        <label>Alternativas:</label>
        <div class="alt-grid">
          ${altsHtml}
        </div>

        <label style="margin-top: 15px;">Resposta Correta (Gabarito):</label>
        <select id="q${i}_gabarito">
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
          <option value="E">E</option>
          <option value="N/A">Nenhuma / Discursiva</option>
        </select>
      </div>
    `;
  }
}

function carregarImagem(e, i) {
  const reader = new FileReader();
  reader.onload = (ev) => imagens[i] = ev.target.result;
  if(e.target.files[0]) {
    reader.readAsDataURL(e.target.files[0]);
  } else {
    delete imagens[i]; 
  }
}

function gerarProva() {
  const escolaInput = document.getElementById("escola").value.trim();
  const serie = document.getElementById("serie").value;
  const disciplina = document.getElementById("disciplina").value;
  const professor = document.getElementById("professor").value;
  const data = document.getElementById("data").value;
  const q = parseInt(document.getElementById("qtdQuestoes").value);
  const gerarGabaritoProf = document.getElementById("gerarGabaritoProf").checked;

  const escolaHeader = escolaInput !== "" 
    ? `<h1>${escolaInput}</h1>` 
    : `<div class="info-row" style="margin-bottom: 10px;"><span><b>Escola:</b></span><div class="linha-preenchimento"></div></div>`;

  let letrasValidasPorQuestao = {};

  let html = `
  <div class="page prova-content">
    <div class="header-prova">
      ${escolaHeader}
      <div class="info-row">
        <span><b>Aluno(a):</b></span><div class="linha-preenchimento"></div>
        <span><b>Nº:</b></span><div class="linha-preenchimento" style="max-width:50px; margin-right:0;"></div>
      </div>
      <div class="info-row">
        <span style="width: 50%;"><b>Série/Turma:</b> ${serie}</span>
        <span style="width: 50%;"><b>Disciplina:</b> ${disciplina}</span>
      </div>
      <div class="info-row" style="margin-bottom: 0;">
        <span style="width: 50%;"><b>Professor(a):</b> ${professor}</span>
        <span style="width: 50%;"><b>Data:</b> ${data}</span>
      </div>
    </div>
  `;

  for (let i = 1; i <= q; i++) {
    let textoEl = document.getElementById(`q${i}_texto`);
    if(!textoEl) continue; 
    
    let texto = textoEl.value.replace(/\n/g, '<br>'); 
    letrasValidasPorQuestao[i] = [];

    html += `<div class="questao-item">
               <div class="enunciado">QUESTÃO ${i}</div>
               <div>${texto}</div>`;

    if (imagens[i]) {
      html += `<img src="${imagens[i]}" class="img-questao">`;
    }

    html += `<div style="margin-top: 10px;">`;
    
    for (let j = 0; j < 5; j++) {
      let altTexto = document.getElementById(`q${i}_alt${j}`).value.trim();
      
      if(altTexto !== "") {
        letrasValidasPorQuestao[i].push(alternativasLetras[j]);
        html += `
          <div class="alternativa-print">
            <span class="letra-alt">${alternativasLetras[j]})</span> 
            <span>${altTexto}</span>
          </div>
        `;
      }
    }
    
    if (letrasValidasPorQuestao[i].length === 0) {
      html += `
        <div class="linha-discursiva"></div>
        <div class="linha-discursiva"></div>
        <div class="linha-discursiva"></div>
        <div class="linha-discursiva"></div>
      `;
    }

    html += `</div></div>`;
  }
  html += `</div>`;

  let cartao = `
  <div class="page">
    <div class="header-prova" style="margin-bottom: 10px;">
      ${escolaHeader}
      <div class="info-row">
        <span><b>Aluno(a):</b></span><div class="linha-preenchimento"></div>
      </div>
      <div class="info-row" style="margin-bottom:0;">
        <span style="width: 50%;"><b>Turma:</b> ${serie}</span>
        <span style="width: 50%;"><b>Disciplina:</b> ${disciplina}</span>
      </div>
    </div>

    <h2 class="cartao-titulo">CARTÃO-RESPOSTA</h2>

    <div class="instrucoes-cartao">
      <strong>INSTRUÇÕES:</strong>
      <ul style="margin: 5px 0 0 0; padding-left: 20px;">
        <li>Preencha a bolinha que corresponde à alternativa correta.</li>
        <li>Tenha atenção ao responder.</li>
        <li>Boa sorte!</li>
      </ul>
    </div>

    <div class="cartao-grid">
  `;

  for (let i = 1; i <= q; i++) {
    if (letrasValidasPorQuestao[i].length === 0) continue;

    cartao += `
      <div class="q-linha-cartao">
        <div class="q-num-cartao">${i}</div>
        <div class="bolhas-container">`;

    for (let letra of letrasValidasPorQuestao[i]) {
      cartao += `<div class="bolha-print">${letra}</div>`;
    }

    cartao += `</div></div>`;
  }
  cartao += `</div></div>`;

  let gabarito = "";
  if (gerarGabaritoProf) {
    gabarito = `
    <div class="page">
      <h2 class="cartao-titulo" style="border-bottom: none;">GABARITO DO PROFESSOR</h2>
      <div class="info-row" style="margin-bottom: 20px;">
        <span style="width: 50%;"><b>Disciplina:</b> ${disciplina}</span>
        <span style="width: 50%;"><b>Data:</b> ${data}</span>
      </div>
      
      <div class="gabarito-lista">
    `;

    for (let i = 1; i <= q; i++) {
      let respostaExata = "N/A";
      let gabaritoEl = document.getElementById(`q${i}_gabarito`);
      if(gabaritoEl) respostaExata = gabaritoEl.value;
      
      gabarito += `<div style="margin-bottom: 5px;"><b>${i}</b> - ${respostaExata}</div>`;
    }

    gabarito += `</div></div>`;
  }

  document.getElementById("saida").innerHTML = html + cartao + gabarito;
  
  let btnImp = document.getElementById("btnImprimir");
  btnImp.disabled = false;
  btnImp.style.background = "#cf6679";
  btnImp.style.color = "black";
}

window.onload = criarCampos;
</script>

</body>
</html>
